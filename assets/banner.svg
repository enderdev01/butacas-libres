  </g>

  <!-- texto -->
  <text x="64" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#e6edf3" letter-spacing="-1">Butacas</text>
  <text x="64" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-style="italic" font-weight="700" fill="url(#accent)" letter-spacing="-1">libres</text>
  <rect x="66" y="206" width="46" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="64" y="238" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#8b949e">cuántos asientos quedan en cada función</text>
</svg>
